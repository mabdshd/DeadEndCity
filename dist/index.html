<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEATLINE: DISTRICT 24</title>
    <script type="module" crossorigin src="./assets/index-CPgpRbgj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DAVq0VTM.css">
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="title-overlay" class="overlay">
      <div class="title-card">
        <h1 class="title-main">HEATLINE</h1>
        <p class="title-sub">DISTRICT 24</p>
        <p class="title-tag">STEAL. ESCAPE. BANK THE CASH.</p>
        <button id="start-button" class="start-button">ENTER DISTRICT 24</button>
      </div>
    </div>
    <div id="debug-panel" class="hidden"></div>
    <div id="interact-prompt" class="hidden"></div>
    <div id="cash-display">
      <span id="cash-banked">BANKED $0</span>
      <span id="cash-carried">CARRIED $0</span>
    </div>
    <div id="health-display">
      <span id="health-text">100</span>
      <div id="health-bar"><div id="health-fill"></div></div>
    </div>
    <div id="crosshair" class="hidden"></div>
    <div id="busted-overlay" class="overlay hidden">
      <div class="title-card">
        <h2 class="busted-main">BUSTED</h2>
        <p class="busted-sub">CARRIED CASH CONFISCATED — BANKED CASH SAFE</p>
      </div>
    </div>
    <div id="objective-display" class="hidden">
      <div id="objective-text">STEAL THE MARKED CAR</div>
      <div id="objective-distance" class="hidden"></div>
    </div>
    <div id="feedback-flash" class="hidden"></div>
    <div id="wanted-display" class="hidden"></div>
    <div id="pause-overlay" class="overlay hidden">
      <div class="title-card">
        <h2>PAUSED</h2>
        <button id="resume-button" class="start-button">RESUME</button>
      </div>
    </div>
    <div id="finale-overlay" class="overlay hidden">
      <div class="title-card">
        <h2 class="finale-main">DISTRICT CLEARED</h2>
        <p id="finale-stats" class="finale-stats"></p>
        <button id="keep-playing-button" class="start-button">KEEP PLAYING</button>
      </div>
    </div>
  </body>
</html>
